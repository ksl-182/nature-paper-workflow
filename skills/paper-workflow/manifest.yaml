name: paper-workflow
version: 1.1.0
description: 论文写作全流程自动化（含文献检索）

steps:
  - id: confirm
    name: 需求确认
    type: manual
    description: 向用户确认论文主题、字数、格式要求

  - id: search
    name: 文献检索
    skill: nature-academic-search
    input: "{{confirm.output}} 主题"
    workflow: multi-source-search
    output: D:/Claude code OUTPUT/references.bib

  - id: writing
    name: 撰写
    skill: nature-writing
    input: "{{confirm.output}} + {{search.output}}"
    output: D:/Claude code OUTPUT/paper_draft.md

  - id: figure
    name: 配图
    skill: nature-figure
    input: "{{writing.output}}"
    output: D:/Claude code OUTPUT/figures/

  - id: citation
    name: 引用格式化
    skill: nature-citation
    input: "{{writing.output}}"
    output: inline (修改 paper_draft.md)

  - id: polishing
    name: 润色
    skill: nature-polishing
    input: "{{writing.output}} + {{figure.output}} + {{citation.output}}"
    output: D:/Claude code OUTPUT/paper_final.md

  - id: thesis
    name: 转 Word
    type: script
    command: python ~/.claude/skills/HBGC-LW/generate_thesis.py
    input: "{{polishing.output}}"
    output: D:/Claude code OUTPUT/paper_final.docx

triggers:
  - 写论文
  - 生成论文
  - 论文全流程
  - 毕设论文
  - 毕业论文
